<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AungZawHtet AI Video Studio</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-slate-950 text-white min-h-screen flex flex-col items-center p-4">

    <!-- Header Section -->
    <header class="text-center my-6">
        <h1 class="text-3xl md:text-4xl font-bold bg-gradient-to-r from-purple-400 to-pink-500 bg-clip-text text-transparent">
            AungZawHtet AI Video Studio
        </h1>
        <p class="text-slate-400 text-sm mt-2">Welcome to your AI creation hub</p>
    </header>

    <!-- Main Studio Box -->
    <main class="w-full max-w-2xl bg-slate-900 border border-slate-800 rounded-2xl p-6 shadow-xl space-y-4">
        
        <!-- 📝 Script Input -->
        <div>
            <label class="block text-sm font-medium text-purple-300 mb-1">📝 Script ထည့်ရန်</label>
            <textarea rows="3" class="w-full bg-slate-950 border border-slate-700 rounded-xl p-3 text-sm focus:outline-none focus:border-purple-500 text-white" placeholder="သင့်ဗီဒီယိုအတွက် Script ရေးပါ..."></textarea>
        </div>

        <!-- Options Grid -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <!-- 🎙️ Myanmar Voice -->
            <div>
                <label class="block text-sm font-medium text-purple-300 mb-1">🎙️ Myanmar Voice</label>
                <select class="w-full bg-slate-950 border border-slate-700 rounded-xl p-3 text-sm focus:outline-none focus:border-purple-500 text-white">
                    <option>Voice 1 (Male - သဘာဝသံ)</option>
                    <option>Voice 2 (Female - ချိုသာသောသံ)</option>
                </select>
            </div>

            <!-- 📱 Video Ratio -->
            <div>
                <label class="block text-sm font-medium text-purple-300 mb-1">📱 Video Size</label>
                <select class="w-full bg-slate-950 border border-slate-700 rounded-xl p-3 text-sm focus:outline-none focus:border-purple-500 text-white">
                    <option>9:16 Video (TikTok / Reels)</option>
                    <option>16:9 Video (YouTube)</option>
                </select>
            </div>
        </div>

        <!-- 🖼️ Scene/Images & Subtitle Toggles -->
        <div class="flex flex-wrap gap-4 pt-2">
            <label class="flex items-center space-x-2 text-sm text-slate-300 cursor-pointer">
                <input type="checkbox" checked class="rounded border-slate-700 text-purple-600 focus:ring-purple-500 bg-slate-950">
                <span>💬 Myanmar Subtitle ထည့်မည်</span>
            </label>
            <label class="flex items-center space-x-2 text-sm text-slate-300 cursor-pointer">
                <input type="checkbox" checked class="rounded border-slate-700 text-purple-600 focus:ring-purple-500 bg-slate-950">
                <span>🎬 Auto Edit ပြုလုပ်မည်</span>
            </label>
        </div>

        <!-- 🚀 Generate Button -->
        <button onclick="alert('ဗီဒီယို ဖန်တီးနေပါပြီ... ခဏစောင့်ပါ!')" class="w-full mt-4 bg-gradient-to-r from-purple-600 to-pink-600 hover:from-purple-500 hover:to-pink-500 text-white font-medium py-3.5 rounded-xl shadow-lg transition-all flex items-center justify-center space-x-2 cursor-pointer">
            <span>✨ Generate Video (MP4 Export)</span>
        </button>

    </main>

    <footer class="text-slate-600 text-xs mt-8">
        &copy; 2026 AungZawHtet AI Studio. All rights reserved.
    </footer>

</body>
</html>
