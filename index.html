<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AungZawHtet AI Video Studio</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-white min-h-screen flex flex-col items-center p-4">

    <header class="w-full max-w-2xl py-6 text-center">
        <h1 class="text-3xl font-bold text-transparent bg-clip-text bg-gradient-to-r from-purple-400 to-pink-600">
            🎬 AungZawHtet AI Video Studio
        </h1>
        <p class="text-slate-400 mt-2">Welcome to your AI creation hub</p>
    </header>

    <main class="w-full max-w-2xl bg-slate-900 p-6 rounded-2xl border border-slate-800">
        <textarea class="w-full bg-slate-950 border border-slate-700 rounded-xl p-4 text-white focus:outline-none focus:ring-2 focus:ring-purple-500" placeholder="မင်းဖန်တီးချင်တဲ့ ဗီဒီယိုအကြောင်း ရေးပါ..."></textarea>

        <button class="w-full mt-4 bg-purple-600 hover:bg-purple-700 py-3 rounded-xl font-bold transition">
            ✨ Generate Video
        </button>
    </main>

</body>
</html>
