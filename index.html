<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Video Generation Studio</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 text-white min-h-screen flex flex-col items-center justify-center p-4">

    <div class="max-w-xl w-full bg-gray-800 p-6 rounded-2xl shadow-xl">
        <h1 class="text-2xl font-bold mb-4 text-center">AI Video Generation Studio</h1>
        
        <div class="mb-4">
            <label class="block text-sm font-medium mb-2">Enter your prompt:</label>
            <input type="text" id="promptInput" placeholder="A futuristic city with flying cars..." class="w-full p-3 rounded-lg bg-gray-700 border border-gray-600 focus:outline-none focus:border-blue-500">
        </div>

        <button id="generateBtn" onclick="generateVideo()" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold p-3 rounded-lg transition">
            Generate Video
        </button>

        <div id="progressSection" class="hidden mt-4 text-center">
            <p id="statusText" class="text-yellow-400 animate-pulse">Generating video, please wait (this may take a couple of minutes due to free server cold start)...</p>
        </div>

        <div id="resultSection" class="hidden mt-6 text-center">
            <h2 class="text-lg font-semibold mb-2">Generated Video:</h2>
            <video id="outputVideo" controls class="w-full rounded-lg mb-4"></video>
            <a id="downloadBtn" class="bg-green-600 hover:bg-green-700 text-white font-bold py-2 px-4 rounded-lg inline-block">Download Video</a>
        </div>
    </div>

    <script>
        async function generateVideo() {
            const prompt = document.getElementById('promptInput').value;
            if (!prompt) {
                alert('Please enter a prompt first!');
                return;
            }

            const btn = document.getElementById('generateBtn');
            const progressSec = document.getElementById('progressSection');
            const statusText = document.getElementById('statusText');
            const resultSec = document.getElementById('resultSection');
            const outputVideo = document.getElementById('outputVideo');
            const downloadBtn = document.getElementById('downloadBtn');

            btn.disabled = true;
            btn.classList.add('opacity-50', 'cursor-not-allowed');
            progressSec.classList.remove('hidden');
            resultSec.classList.add('hidden');

            const maxRetries = 5;
            const delay = (ms) => new Promise(resolve => setTimeout(resolve, ms));

            for (let attempt = 1; attempt <= maxRetries; attempt++) {
                try {
                    statusText.innerText = `Generating video... (Attempt ${attempt}/${maxRetries}, please wait)`;

                    const response = await fetch("https://api-inference.huggingface.co/models/damo-vilab/text-to-video-ms-1.7b", {
                        method: "POST",
                        headers: { 
                            "Content-Type": "application/json",
                            "Authorization": "Bearer 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"
                        },
                        body: JSON.stringify({ inputs: prompt })
                    });

                    // မော်ဒယ်လ်က Cold Start ဖြစ်နေရင် (Loading နေရင်) 503 ပြန်တတ်ပါတယ်
                    if (response.status === 503) {
                        statusText.innerText = "Model is loading on server... retrying in 20 seconds...";
                        await delay(20000); // စက္ကန့် ၂၀ စောင့်မယ်
                        continue;
                    }

                    if (!response.ok) {
                        throw new Error("Video generation failed. Status: " + response.status);
                    }

                    const blob = await response.blob();
                    const videoUrl = URL.createObjectURL(blob);

                    outputVideo.src = videoUrl;
                    downloadBtn.href = videoUrl;
                    downloadBtn.download = "ai-generated-video.mp4";

                    progressSec.classList.add('hidden');
                    resultSec.classList.remove('hidden');
                    break; // အောင်မြင်ရင် loop ကနေ ထွက်မယ်

                } catch (error) {
                    if (attempt === maxRetries) {
                        alert("Error: " + error.message);
                        progressSec.classList.add('hidden');
                    } else {
                        await delay(10000);
                    }
                }
            }

            btn.disabled = false;
            btn.classList.remove('opacity-50', 'cursor-not-allowed');
        }
    </script>
</body>
</html>
