<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AungZawHtet AI Auto Video Studio</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-slate-950 text-white min-h-screen flex flex-col items-center p-4">

    <header class="text-center my-6">
        <h1 class="text-3xl md:text-4xl font-bold bg-gradient-to-r from-purple-400 to-pink-500 bg-clip-text text-transparent">
            AI Auto Video Generator
        </h1>
        <p class="text-slate-400 text-sm mt-2">Script ထည့်ရုံဖြင့် Auto Edit ပြီးသား ဗီဒီယိုထုတ်ပေးသည်</p>
    </header>

    <main class="w-full max-w-2xl bg-slate-900 border border-slate-800 rounded-2xl p-6 shadow-xl space-y-4">
        
        <div>
            <label class="block text-sm font-medium text-purple-300 mb-1">📝 ဇာတ်ညွှန်း (Script) ထည့်ရန်</label>
            <textarea id="scriptInput" rows="3" class="w-full bg-slate-950 border border-slate-700 rounded-xl p-3 text-sm focus:outline-none focus:border-purple-500 text-white" placeholder="ဥပမာ - A 3D animated boy opening a box with surprise expression..."></textarea>
        </div>

        <button id="generateBtn" onclick="generateAutoVideo()" class="w-full mt-4 bg-gradient-to-r from-purple-600 to-pink-600 hover:from-purple-500 hover:to-pink-500 text-white font-medium py-3.5 rounded-xl shadow-lg transition-all flex items-center justify-center space-x-2 cursor-pointer">
            <span>🎬 Auto Edit & Generate Video</span>
        </button>

        <div id="progressSection" class="hidden space-y-2 pt-2 text-center">
            <p id="statusText" class="text-xs text-purple-300 animate-pulse">AI က ဗီဒီယိုကို အလိုအလျောက် တည်းဖြတ်နေပါပြီ (ခဏစောင့်ပါ)...</p>
            <div class="w-full bg-slate-950 border border-slate-800 rounded-full h-3 overflow-hidden">
                <div class="bg-gradient-to-r from-purple-500 to-pink-500 h-full w-full animate-pulse"></div>
            </div>
        </div>

        <div id="resultSection" class="hidden pt-4 border-t border-slate-800 text-center space-y-3">
            <p class="text-green-400 font-medium text-sm">✅ Edit ပြီးသား ဗီဒီယို အောင်မြင်စွာ ထွက်ရှိပါပြီ!</p>
            <video id="outputVideo" controls class="w-full max-h-80 rounded-xl border border-slate-700 mx-auto"></video>
            <a id="downloadBtn" download="AI_Auto_Edited_Video.mp4" class="inline-block bg-emerald-600 hover:bg-emerald-500 text-white text-sm font-medium px-6 py-2.5 rounded-xl shadow transition-all cursor-pointer">
                ⬇️ Download MP4 Video
            </a>
        </div>

    </main>

    <script>
        async function generateAutoVideo() {
            const prompt = document.getElementById('scriptInput').value.trim();
            if (!prompt) {
                alert('ကျေးဇူးပြု၍ Script အရင်ရေးထည့်ပါ!');
                return;
            }

            const btn = document.getElementById('generateBtn');
            const progressSec = document.getElementById('progressSection');
            const resultSec = document.getElementById('resultSection');
            const outputVideo = document.getElementById('outputVideo');
            const downloadBtn = document.getElementById('downloadBtn');

            btn.disabled = true;
            btn.classList.add('opacity-50', 'cursor-not-allowed');
            progressSec.classList.remove('hidden');
            resultSec.classList.add('hidden');

            try {
                // Free AI Video Generation Model API 
                const response = await fetch("https://api-inference.huggingface.co/models/camenduru/text-to-video-ms-1.7b", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ inputs: prompt })
                });

                if (!response.ok) throw new Error("Video generation failed.");

                const blob = await response.blob();
                const videoUrl = URL.createObjectURL(blob);

                outputVideo.src = videoUrl;
                downloadBtn.href = videoUrl;

                progressSec.classList.add('hidden');
                resultSec.classList.remove('hidden');

            } catch (error) {
                alert("ဆာဗာတွင် ဝန်ထုပ်ဝန်ပိုး များနေပါသဖြင့် ခဏနေမှ ထပ်ကြိုးစားပါ။");
                progressSec.classList.add('hidden');
            } finally {
                btn.disabled = false;
                btn.classList.remove('opacity-50', 'cursor-not-allowed');
            }
        }
    </script>
</body>
</html>
